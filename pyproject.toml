[project]
name = "news-bot"
version = "0.1.0"
description = "Telegram News Intelligence Bot — personalized, multi-source, AI-summarized news digests"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.5",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "fast-langdetect>=0.3",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "google-genai>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "faker>=28.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP037 strips quotes from forward-referenced type hints, but our SQLAlchemy
# models rely on quoted cross-file references (e.g. NewsArticle referenced
# in source.py before InterestCategory's module is imported) specifically
# to avoid circular imports between model files. Keep those quoted.
ignore = ["UP037"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a function default is FastAPI's documented dependency-
# injection pattern, not the mutable-default-argument bug B008 looks for.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*", "backend*", "pipeline*", "workers*", "shared*"]
